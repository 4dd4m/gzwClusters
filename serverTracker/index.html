<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GZW Server Tracker</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #eef0e8;
        --paper: #f8f9f3;
        --ink: #1f2619;
        --muted: #5d6655;
        --line: #cdd2c2;
        --accent: #b4530f;
        --danger: #a8321f;
        --fresh: #c62828;
        --ready: #2e7d32;
        --body: "IBM Plex Sans", system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151a13;
          --paper: #1c2219;
          --ink: #e3e8d9;
          --muted: #9aa58e;
          --line: #343d2e;
          --accent: #f08a3c;
          --danger: #e0644c;
          --fresh: #ef5350;
          --ready: #66bb6a;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.4 var(--body);
      }
      main { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
      h1 { font-size: 22px; margin: 0 0 16px; letter-spacing: 0.02em; }
      form, ul {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 14px;
      }
      form { display: grid; gap: 10px; }
      label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
      select, input, button {
        font: inherit;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 8px 10px;
      }
      button { cursor: pointer; font-weight: 600; }
      #looted { background: var(--accent); border-color: var(--accent); color: #fff; }
      #looted:disabled { opacity: 0.5; cursor: default; }
      ul { list-style: none; margin: 16px 0; padding: 0; }
      li {
        display: flex;
        justify-content: space-between;
        padding: 10px 14px;
        border-top: 1px solid var(--line);
      }
      li:first-child { border-top: 0; }
      li .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 10px;
        align-self: center;
        flex: none;
        background: var(--ready);
      }
      li .dot.fresh { background: var(--fresh); }
      li .ago { font-family: var(--mono); color: var(--accent); margin-left: auto; }
      li .del {
        margin-left: 12px;
        padding: 0 8px;
        color: var(--danger);
        border-color: transparent;
        background: transparent;
        line-height: 1;
      }
      li .del:hover { border-color: var(--danger); }
      ul:empty::before { content: "No looted servers yet"; display: block; padding: 10px 14px; text-align: center; color: var(--muted); }
      #reset { width: 100%; color: var(--danger); border-color: var(--danger); background: transparent; }
    </style>
  </head>
  <body>
    <main>
      <h1>GZW Server Tracker</h1>

      <form id="form">
        <label>
          Server
          <select id="server" required>
            <option value="">Select a server…</option>
          </select>
        </label>
        <label>
          Looted at
          <input id="time" type="time" required />
        </label>
        <button id="looted" type="submit" disabled>Looted</button>
      </form>

      <ul id="list"></ul>
      <template id="row">
        <li><span class="dot"></span><span class="name"></span><span class="ago"></span><button class="del" type="button" title="Remove">✕</button></li>
      </template>

      <button id="reset" type="button">Reset</button>
    </main>

    <script>
      const SERVERS = [
        "Asia East", "Asia Northeast", "Asia Southeast",
        "Europe East", "Europe West",
        "Mainland China", "Middle East", "Oceania",
        "South Africa East", "South Africa West", "South America",
        "US Central", "US East", "US West",
      ];
      const KEY = "gzwServerTracker";
      const HOUR = 3600000;

      const $ = (id) => document.getElementById(id);

      const load = () => {
        try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
      };

      /* server cleanup: drops servers looted more than an hour ago (on load, and on each Looted) */
      function prune(data) {
        for (const [name, at] of Object.entries(data)) if (Date.now() - at > HOUR) delete data[name];
        return data;
      }

      function commit(data) {
        localStorage.setItem(KEY, JSON.stringify(data));
        renderServers(data);
        render(data);
      }

      /* the dropdown offers only servers not already in the looted list */
      function renderServers(data) {
        const sel = $("server"),
          keep = sel.value;
        sel.length = 1;
        for (const name of SERVERS) if (!(name in data)) sel.add(new Option(name));
        sel.value = keep in data ? "" : keep;
        $("looted").disabled = !sel.value;
      }

      function render(data = load()) {
        const now = Date.now();
        $("list").replaceChildren(
          ...Object.entries(data)
            .sort((a, b) => a[1] - b[1])
            .map(([name, at]) => {
              const li = $("row").content.firstElementChild.cloneNode(true);
              const mins = Math.max(0, Math.floor((now - at) / 60000));
              li.dataset.name = name;
              /* red while looted less than an hour ago, green after */
              li.querySelector(".dot").classList.toggle("fresh", mins < 60);
              li.querySelector(".name").textContent = name;
              li.querySelector(".ago").textContent = `${mins} min`;
              return li;
            })
        );
      }

      $("server").addEventListener("change", () => {
        $("time").value = new Date().toTimeString().slice(0, 5);
        $("looted").disabled = !$("server").value;
      });

      $("form").addEventListener("submit", (e) => {
        e.preventDefault();
        const [h, m] = $("time").value.split(":").map(Number);
        const at = new Date();
        at.setHours(h, m, 0, 0);
        /* a time later than now means it was looted before midnight */
        if (at > Date.now()) at.setDate(at.getDate() - 1);
        const data = prune(load());
        data[$("server").value] = at.getTime();
        commit(data);
      });

      $("list").addEventListener("click", (e) => {
        const name = e.target.closest(".del")?.parentElement.dataset.name;
        if (!name || !confirm(`Remove ${name} from the looted list?`)) return;
        const data = load();
        delete data[name];
        commit(data);
      });

      $("reset").addEventListener("click", () => {
        if (confirm("Clear all looted servers?")) commit({});
      });

      commit(prune(load()));
      setInterval(render, 15000);
    </script>
  </body>
</html>
