              ><button type="button" id="reset" data-i18n="reset.btn" data-i18n-title="reset.title"></button>
            </div>
          </div>
        </section>
        <section class="panel">
          <h2 data-i18n="preset.title"></h2>
          <div class="presets">
            <select id="preset" data-i18n-aria="preset.selectAria" aria-describedby="hPreset"></select>
            <div class="prow">
              <button type="button" id="presetDel" data-i18n-title="preset.delTitle">
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4M6.8 6.5v4.5M9.2 6.5v4.5" /></svg
                ><span data-i18n="preset.delete"></span>
              </button>
              <button type="button" id="presetCopy" aria-haspopup="dialog" data-i18n-title="preset.copyTitle">
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8" height="8" rx="1" /><path d="M10.5 3V2.5a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1H3" /></svg
                ><span data-i18n="preset.copy"></span>
              </button>
              <button type="button" id="presetReset" aria-haspopup="dialog" data-i18n-title="preset.resetTitle">
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 8a5.2 5.2 0 1 0 1.6-3.8M2.5 1.8v3h3" /></svg
                ><span data-i18n="preset.reset"></span>
              </button>
              <button type="button" id="presetNew" aria-haspopup="dialog" data-i18n-title="preset.newTitle">
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v11M2.5 8h11" /></svg
                ><span data-i18n="preset.new"></span>
              </button>
            </div>
            <div class="hint wide" id="hPreset" role="tooltip" data-i18n-html="preset.hint"></div>
          </div>
        </section>
        <section class="panel">
          <h2><span data-i18n="ty.title"></span> <small id="tyCount"></small></h2>
          <div class="tsearch">
            <input type="search" id="tq" data-i18n-placeholder="ty.searchPh" data-i18n-aria="ty.searchAria" />
            <div class="tsel"><button type="button" id="tyNone" data-i18n="ty.none"></button></div>
            <div class="chips" id="chips"></div>
          </div>
          <div class="types" id="types"></div>
        </section>
      </aside>

      <div class="mapcol">
        <div class="mapbox" id="mapbox">
          <div class="maptools">
            <div class="legend">
              <button type="button" class="lghelp" aria-describedby="lgPop" data-i18n-aria="lg.title" data-i18n-title="lg.title">?</button>
              <div class="lgpop" id="lgPop" role="tooltip">
                <div class="lgrow rt"><i class="sym"><i class="ln"></i></i><span data-i18n-html="lg.route"></span></div>
                <div class="lgrow rt"><i class="sym"><i class="ln d"></i></i><span data-i18n-html="lg.lzleg"></span></div>
                <div class="lgrow"><i class="sym"><img alt="" data-lgicon="landingZone" /></i><span data-i18n-html="lg.lz"></span></div>
                <div class="lgrow rt"><i class="sym"><i class="num">3</i></i><span data-i18n-html="lg.num"></span></div>
                <div class="lgrow"><i class="sym"><i class="badge ok">✓</i></i><span data-i18n-html="lg.looted"></span></div>
                <div class="lgrow"><i class="sym"><i class="badge nf">✕</i></i><span data-i18n-html="lg.nf"></span></div>
                <div class="lgrow"><i class="sym"><svg viewBox="0 0 17 16" width="17" height="16" aria-hidden="true"><path d="M4 1h9a3 3 0 0 1 3 3v5a3 3 0 0 1-3 3h-1l1 3.5L9 12H4a3 3 0 0 1-3-3V4a3 3 0 0 1 3-3z" fill="#f3c623" stroke="#0d130b" stroke-width="1.4"/><circle cx="5" cy="6.5" r="1.1" fill="#0d130b"/><circle cx="8.5" cy="6.5" r="1.1" fill="#0d130b"/><circle cx="12" cy="6.5" r="1.1" fill="#0d130b"/></svg></i><span data-i18n-html="lg.note"></span></div>
                <div class="lgrow"><i class="sym"><svg viewBox="0 0 18 24" width="13" height="18" aria-hidden="true"><path d="M9 23C8 20 2 15 2 9a7 7 0 0 1 14 0c0 6-6 11-7 14z" fill="#2fbf71" stroke="#0d130b" stroke-width="1.8"/><circle cx="9" cy="9" r="2.8" fill="#fff"/></svg></i><span data-i18n-html="lg.me"></span></div>
                <div class="lgrow"><i class="sym"><img alt="" data-lgicon="cm-drug" /></i><span data-i18n-html="lg.cm"></span></div>
                <div class="lgrow"><i class="sym"><i class="ln z"></i></i><span data-i18n-html="lg.zone"></span></div>
                <p class="lgclick" data-i18n-html="lg.click"></p>
              </div>
            </div>
            <div class="tools">
              <label class="switch" data-i18n-title="sw.measureTitle"
                ><input type="checkbox" role="switch" id="measure" /><span class="track" aria-hidden="true"></span
                ><span data-i18n="sw.measure"></span></label
              ><label class="switch" data-i18n-title="sw.zonesTitle"
                ><input type="checkbox" role="switch" id="zoneB" /><span class="track" aria-hidden="true"></span
                ><span data-i18n="sw.zones"></span></label
              ><label class="switch rt"
                ><input type="checkbox" role="switch" id="legNum" /><span class="track" aria-hidden="true"></span
                ><span data-i18n="sw.legNum"></span></label
              ><label class="switch rt"
                ><input type="checkbox" role="switch" id="legLen" /><span class="track" aria-hidden="true"></span
                ><span data-i18n="sw.legLen"></span></label
              ><label class="switch rt"
                ><input type="checkbox" role="switch" id="legHead" /><span class="track" aria-hidden="true"></span
                ><span data-i18n="sw.legHead"></span></label
              ><label class="switch rt bailsw" data-i18n-title="sw.bailTitle"
                ><input type="checkbox" role="switch" id="bail" /><span class="track" aria-hidden="true"></span
                ><span data-i18n="sw.bail"></span></label
              ><label class="switch" data-i18n-title="sw.poiTitle"
                ><input type="checkbox" role="switch" id="poiNames" /><span class="track" aria-hidden="true"></span
                ><span data-i18n="sw.poi"></span></label
              ><label class="switch" data-i18n-title="sw.cmTitle"
                ><input type="checkbox" role="switch" id="cmShow" /><span class="track" aria-hidden="true"></span
                ><span data-i18n="sw.cm"></span></label
              ><label class="switch" data-i18n-title="sw.codesTitle"
                ><input type="checkbox" role="switch" id="doorCodes" /><span class="track" aria-hidden="true"></span
                ><span data-i18n="sw.codes"></span
              ></label>
            </div>
            <button id="full" type="button" data-i18n="full"></button>
          </div>
          <canvas id="cv" tabindex="0" data-i18n-aria="cv.aria"></canvas>
          <div class="zoomctl">
            <button type="button" id="zIn" data-i18n-title="zoom.inTitle" data-i18n-aria="zoom.in">+</button
            ><button type="button" id="zOut" data-i18n-title="zoom.outTitle" data-i18n-aria="zoom.out">−</button>
          </div>
          <div class="zlvl"><span id="zlvl"></span><span id="gridAt" hidden></span></div>
          <div class="mhint" id="mhint" role="status" hidden></div>
          <div class="tip" id="tip" hidden></div>
          <div class="busy" id="busy" hidden data-i18n="busy"></div>
        </div>
        <p class="mapcredit" id="mapCredit" data-i18n-html="credit"></p>
      </div>

      <aside class="right nosel noanim">
        <section class="panel">
          <h2>
            <span class="rtitle"><span data-i18n="runs.title"></span> <small data-i18n="runs.sub"></small></span
            ><span class="rbtns rt"
              ><button type="button" id="srvReset" class="recalc" data-i18n-title="server.title">
                <span data-i18n="server.btn"></span></button
              ><button type="button" id="recalc" class="recalc" data-i18n-title="recalc.title">
                <span data-i18n="recalc.btn"></span><b id="recalcN" hidden></b></button
            ></span>
          </h2>
          <div class="runs" id="runs"></div>
        </section>
        <section class="panel detpanel">
          <h2>
            <span id="dT"></span
            ><label class="inv" data-i18n-title="inv.title"
              ><input type="checkbox" id="inv" /> <span data-i18n="inv.label"></span
            ></label>
          </h2>
          <div class="det" id="det"></div>
          <div class="tbl">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th data-i18n="th.stop"></th>
                  <th data-i18n="th.leg"></th>
                  <th id="thHdg" data-i18n="th.hdg"></th>
                  <th data-i18n-title="th.looted">✓</th>
                  <th data-i18n-title="th.nf">✕</th>
                </tr>
              </thead>
              <tbody id="wp"></tbody>
            </table>
          </div>
        </section>
      </aside>
    </div>

    <script src="i18n.js"></script>
    <script src="data.js"></script>
    <script src="planner.js"></script>
    <script src="app.js"></script>
